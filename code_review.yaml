# Commit to the ROOT of Generalized-Labs/oath as: code_review.yaml
#
# A repo-root code_review.yaml governs this repository only. It fully replaces
# any org-wide file rather than merging with it.
# Reference: https://www.ellipsis.dev/docs/code-review/configuration-yaml

ellipsis:
  version: v1
  kind: code_review
  name: Oath supply-chain and npm-compat review
  description: >-
    Correctness, fail-closed verification behavior, npm 11 parity, and a cheap
    dedicated pass over the dependency-bump backlog.

pull_requests:
  base:
    - default # master
  # Declaring `pull_requests:` at all sets the audience to humans only, so
  # `for:` is restated here explicitly rather than left to inference.
  #
  # `bots: false` means Dependabot and Renovate PRs are NOT reviewed. To review
  # every bot except those two — the built-in default — swap the line below for:
  #     bots:
  #       exclude: ["dependabot[bot]", "renovate[bot]"]
  # To review dependency bumps too, use `bots: true`.
  # https://www.ellipsis.dev/docs/code-review/which-prs-get-reviewed
  for:
    users: true
    bots: false

permissions:
  github:
    permissions: read_only # reviewers propose findings; Ellipsis posts the review

environment:
  compute:
    cpu: 2
    memory: 8GB
    timeout: 30m

  image:
    # Every version below is lifted from .github/workflows/ci.yml:
    #   - node 24.13.0            (actions/setup-node, every job)
    #   - npm 11.12.1             (`npm install --global npm@11.12.1`, the
    #                              reference the behavioral contract compares to)
    #   - libseccomp-dev          ("Install Linux sandbox linker dependency")
    #   - rust stable             (`rustup toolchain install stable`), and
    #                              Cargo.toml pins rust-version = "1.94",
    #                              edition 2024
    # Go 1.26.1 and the python venv from the `agent-contracts` job are omitted —
    # they only build the cross-language contract clients. Add them here if you
    # want reviewers running `contracts/go` or `contracts/python`.
    dockerfile_append: |
      RUN apt-get update && apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libseccomp-dev curl ca-certificates \
        && rm -rf /var/lib/apt/lists/*
      RUN curl -fsSL https://deb.nodesource.com/setup_24.x | bash - \
        && apt-get install -y nodejs \
        && npm install --global npm@11.12.1 \
        && rm -rf /var/lib/apt/lists/*
      RUN command -v rustup >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --no-modify-path
      ENV PATH="/usr/local/cargo/bin:/root/.cargo/bin:${PATH}"
      RUN rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt \
        && rustup default 1.94.0

    # Registry warm only — image.setup has a 600s cap, and `cargo build --locked
    # --bin oath` from cold does not reliably fit. `cargo check -p <crate>` on a
    # specific hypothesis is what reviewers should reach for.
    setup: |
      cargo fetch --locked

  # ci.yml sets this globally; kept so a reviewer running clippy sees the same
  # gate CI does. Drop it if you would rather ad-hoc `cargo check` tolerate
  # pre-existing warnings.
  variables:
    - name: RUSTFLAGS
      value: "-D warnings"

description:
  name: pr-description
  budget: 1.50
  claude:
    model: claude-haiku-4-5-20251001 # summarizing, not judging — and it runs on every push
    system: |
      Summarize this pull request for the reviewer who has to approve it.

      Open with one sentence: what the change does and which crates or scripts
      it touches. Then short grouped bullets naming real functions, crates, and
      files in backticks.

      Always give its own bullet to any change that touches:
        - verification, integrity, checksum, signature, or attestation logic
        - policy evaluation or its defaults, including `oath-policy.toml.example`
        - the sandbox / containment backend or its fail-closed path
        - `tests/compat/behavioral-contract.json` or anything under
          `tests/compat/` — say whether the contract was regenerated
        - resolver or lockfile placement semantics
        - `install.sh`, release packaging, or the homebrew formula
        - a published claim: `BENCHMARKS.md`, `docs/GA_EVIDENCE.md`, or the
          evidence site

      For a dependency bump, state the crate or action, the old and new
      versions, and whether it crosses a major boundary — in one line.

      Emit summary prose only. No headings, no HTML, no signature — Ellipsis
      supplies the markers, callout, and footer.

review:
  # Declaring `review:` replaces the built-in `bugs` reviewer, so the general
  # correctness pass below is written out explicitly rather than inherited.
  - name: correctness
    budget: 3.50
    claude:
      model: claude-opus-5
      fallback_model: claude-sonnet-5
      effort: high
      system: |
        Find the defects in this change before they reach production. Do not
        summarize the diff, do not praise it, do not rewrite it for style.

        Read the diff, then read outward: grep for callers of anything changed,
        check the surrounding module, and check git history for why the current
        code looks the way it does.

        Report:
          - Correctness errors — inverted conditions, off-by-one bounds, the
            wrong variable returned, integer overflow, divide-by-zero.
          - Unhandled edge cases — empty collections, zero and negative values,
            absent optionals, duplicate or unordered input.
          - Error handling — silent failures, `unwrap`/`expect` on input that
            comes from a registry response or a package tarball, retries over
            non-idempotent effects, half-updated state on the error path.
          - Concurrency and ordering — races, TOCTOU, a lock held across an
            await point, a cache written before the source of truth.
          - Security — untrusted input reaching a query, shell, or file path;
            missing authorization; leaked credentials. Judge on exploitability.
          - Regressions callers depend on — a removed or renamed field, flag,
            subcommand, or JSON key; a changed default; a changed exit code.
          - Data and deploy hazards — a lockfile or on-disk format change that
            breaks installs written by the shipped version, a migration that
            breaks the running registry, anything needing two components
            deployed together.
          - Missing tests, only when the absence is itself the finding.

        This project runs on Linux, macOS, and Windows. Path handling,
        separators, case sensitivity, symlinks, and executable bits are
        recurring cross-platform failures here — treat a platform-conditional
        branch as worth reading line by line.

        Skip style, formatting, and naming — CI runs with `RUSTFLAGS=-D
        warnings` and owns that. Skip speculation you cannot tie to a concrete
        failing input.

        For each finding: state the defect and the input or state that triggers
        it, anchor it to the lines that cause it, rate severity 1-5, and prefer
        a one-click GitHub suggestion over prose. Stay under about four
        sentences. If the change is clean, say so in one line.

  - name: supply-chain
    budget: 3.00
    pull_requests:
      paths:
        - crates/oath-core/** # policy types and the shared decision path
        - crates/oath-analyze/**
        - crates/oath-fetch/** # bytes arrive here; verification lives next to it
        - crates/oath-sandbox/**
        - crates/oath-transparency/**
        - crates/oath-registry/**
        - crates/oath-contracts/**
        - contracts/**
        - install.sh
        - scripts/**
        - tests/detection/**
        - oath-policy.toml.example
        - SECURITY.md
    claude:
      model: claude-opus-5
      fallback_model: claude-sonnet-5
      effort: high
      system: |
        You review the security posture of a tool whose entire value is that it
        fails closed. A change that makes a missing or unverifiable proof
        degrade into a warning is the most severe finding you can report.

        **Fail closed, always.** Every verification path — checksum, `.sha256`
        sidecar, signature, attestation, provenance, the sandbox enforcement
        backend — must reject on absent, malformed, or unverifiable input.
        Flag: a `Result` mapped to a default, an `unwrap_or(true)`, an `if let
        Ok(..)` whose `else` branch continues, a verification error logged and
        swallowed, and a missing containment backend that proceeds unsandboxed.
        The README promises the installer "fails closed when the checksum is
        missing or wrong" — hold every new path to that same standard.

        **Nothing untrusted executes before it is judged.** Trace the order:
        resolve, fetch, verify bytes, analyze, apply policy, then and only then
        run. Flag any path where a lifecycle script, a `postinstall`, a binary,
        or a plugin could execute before the policy decision — including on the
        error and cleanup paths. `--dry-run` must not start package code under
        any input.

        **Archive extraction.** Tarball and zip entries are attacker-controlled.
        Flag missing guards against `..` traversal, absolute paths, symlinks and
        hardlinks pointing outside the destination, device nodes, setuid bits,
        entries that collide after case-folding or Unicode normalization,
        decompression bombs, and unbounded entry counts or sizes.

        **TOCTOU.** The bytes verified must be the bytes installed. Flag any
        window where content is re-read, re-fetched, or re-resolved between
        verification and use, and any cache keyed on something weaker than the
        content digest.

        **Policy evaluation.** Defaults must deny. Flag a new policy field whose
        absence permits, precedence between allow and deny rules that lets an
        allow override a deny, a glob or pattern matcher that can be escaped,
        and any policy decision that depends on a value the package itself
        controls.

        **Identity and integrity.** Package identity must bind name, version,
        resolved URL, and digest together. Flag comparisons of digests or
        signatures that are not constant-time where an oracle is reachable,
        truncated digests, a digest algorithm chosen from attacker-supplied
        metadata, and registry responses trusted without pinning.

        **Evidence.** This project publishes measured claims and refuses to
        overclaim. If a change alters detection behavior, the four-population
        gate, or a number in `BENCHMARKS.md` or `docs/GA_EVIDENCE.md` without
        updating the corresponding evidence, that is a finding.

        Report only defects you can tie to a concrete exploitable input or
        sequence. State the defect, anchor it to the causing lines, rate
        severity 1-5, prefer a GitHub suggestion, stay under about four
        sentences. Skip style. If nothing is wrong, say so in one line.

  - name: npm-compat
    budget: 1.50
    pull_requests:
      paths:
        - crates/oath-resolve/** # placement, dedupe, peer resolution
        - crates/oath-workspace/** # workspaces, links, lockfile surface
        - crates/oath-store/** # on-disk tree layout
        - crates/oath-cli/**
        - tests/compat/**
        - scripts/compat-behavioral.mjs
        - scripts/compat-scale.mjs
        - scripts/npm-parity.mjs
        - scripts/generate-behavioral-contract.mjs
        - scripts/project-corpus.mjs
        - scripts/project-parity.mjs
    claude:
      model: claude-sonnet-5 # parity checking against a written contract — cheaper tier is enough
      fallback_model: claude-haiku-4-5-20251001
      effort: medium
      system: |
        You check that this stays a drop-in replacement for `npm` and `npx`.
        The goal is npm 11 parity; npm 11.12.1 is the reference the behavioral
        contract is generated against.

        Check:
          - **Placement semantics.** Hoisting, deduplication, nested versus
            flat installs, peer dependency resolution, optional dependencies
            skipped on a non-matching platform, and workspace/link handling.
            A tree that differs from npm's is a compatibility break even when
            it is arguably more correct — say which npm behavior it diverges
            from.
          - **Lockfile determinism.** The same inputs must produce the same
            lockfile bytes. Flag map iteration order reaching serialized
            output, unstable sorts over observable ties, and timestamps or
            absolute paths written into the lock.
          - **CLI surface.** Flag names, argument parsing, exit codes, what
            goes to stdout versus stderr, and the shape of `--json` output.
            `--json` is a machine contract: a renamed or removed key breaks
            consumers, and mixing human text into stdout breaks piping.
          - **The contract file.** CI regenerates
            `tests/compat/behavioral-contract.json` and runs `git diff
            --exit-code` against it. If this PR changes behavior the contract
            covers but does not regenerate it, that is the finding. If it
            changes the contract without changing behavior, ask why.
          - **Cross-platform.** Path separators, case-insensitive filesystems,
            symlink support on Windows, shebang and `.cmd` shim generation for
            `npx`-equivalent execution, and the `.exe` suffix.

        Do not review security posture or general correctness — other reviewers
        own those. Report only divergences from npm behavior you can name
        specifically, with the npm behavior stated. Anchor to the causing lines,
        rate severity 1-5, prefer a GitHub suggestion, stay under about four
        sentences. If nothing diverges, say so in one line.

  - name: dependency-bumps
    budget: 1.00
    # Wakes only on PRs that touch manifests, locks, or workflow pins, and costs
    # nothing on a PR that touches none of them.
    #
    # NOTE: with `for.bots: false` above, Dependabot's own PRs are never
    # reviewed, so this reviewer only fires on human PRs that move a dependency
    # (a rebase, a manual bump, a bump folded into a feature branch). It stays
    # in the file so that flipping `bots` on later needs no other change.
    pull_requests:
      paths:
        - Cargo.toml
        - Cargo.lock
        - crates/*/Cargo.toml
        - .github/workflows/**
        - website/package.json
        - website/package-lock.json
        - contracts/python/requirements.txt
        - contracts/go/go.mod
        - contracts/go/go.sum
        - homebrew/**
    claude:
      model: claude-sonnet-5 # mechanical, high-volume, well-specified — Opus is not worth it here
      fallback_model: claude-haiku-4-5-20251001
      effort: medium
      system: |
        You review dependency updates for a tool that verifies package bytes.
        Most of these are safe and deserve a one-line confirmation. Your job is
        to catch the few that are not, and to be fast and cheap about it.

        For each bump, determine whether it crosses a major version boundary. If
        it does, read the call sites in this repository and confirm they were
        updated. Pay particular attention to crates that carry the verification
        contract — hashing (`sha1`, `sha2`, `blake3`), randomness
        (`getrandom`, `rand`), signatures, TLS, and serialization (`toml`,
        `serde`). A major bump in one of those can change digest output,
        default RNG source, parser strictness, or error type while still
        compiling. If a crate's output or defaults could differ and no test
        pins the expected value, that is the finding.

        Also check:
          - `Cargo.lock` is committed alongside the manifest change, and the
            resolved version actually matches the manifest.
          - No transitive dependency was silently downgraded or swapped for a
            different source.
          - New or changed transitive dependencies do not introduce a
            build-time script or proc-macro that was not there before.
          - For GitHub Actions bumps: this repository pins actions by full
            commit SHA with the version in a trailing comment. A bump that
            replaces a SHA with a floating tag is a regression — flag it.
            Also confirm the comment matches the SHA.
          - For a major action bump, check whether the workflow uses an input
            or output the new major removed or renamed.
          - License changes on newly added dependencies — `scripts/
            license-check.mjs` enforces Apache-2.0 declarations.

        Do not comment on the desirability of updating, on changelog contents
        you cannot verify from this diff, or on style. If the bump is a routine
        patch or minor with no call-site impact, say so in one line and stop.

        Anchor findings to the causing lines, rate severity 1-5, prefer a
        GitHub suggestion, stay under about four sentences.

# No `filter:` gatekeeper. Each reviewer is briefed to report only confirmed
# defects and they are scoped so their remits barely overlap; Ellipsis already
# dedupes across reviewers and posts a single review. A gate would roughly
# double cost and latency.
# https://www.ellipsis.dev/docs/code-review/gatekeeper

budget:
  run: 11.50 # per-review ceiling; the five agent budgets above sum to 10.50
  day: 50.00 # trailing 1-day cap (bot PRs are excluded, so volume is human-paced)
  week: 200.00 # trailing 7-day cap
