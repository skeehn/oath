name: Evidence website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "compat-results/ga/summary.json"
      - ".github/workflows/evidence-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install Rust toolchain
        run: rustup toolchain install stable && rustup default stable
      - name: Install Linux sandbox linker dependency
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - name: Build Oath
        run: cargo build --release --locked --bin oath
      - name: Install website through Oath
        working-directory: website
        run: ../target/release/oath ci
      - name: Build website through Oath
        working-directory: website
        run: ../target/release/oath run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
